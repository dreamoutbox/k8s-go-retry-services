apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: retry-demo
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: service-a:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_B_URL
              value: "http://service-b.retry-demo.svc.cluster.local:8080"
            - name: RETRY_MAX_ATTEMPTS
              value: "5"
            - name: RETRY_BASE_DELAY
              value: "100ms"
            - name: RETRY_MAX_DELAY
              value: "2s"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
